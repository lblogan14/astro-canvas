[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "astro-canvas-rbcodes"
version = "0.1.0a0"
description = "Astro Canvas node pack wrapping rbcodes: absorption lines, redshift finding, multi-spectrum viewer, IFU cubes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Bin Liu" }]
dependencies = [
  "astro-canvas-sdk",
  "astro-canvas-core",
  # Upstream rbcodes pins `python_requires <3.11`, so uv can only select it on
  # 3.10 until the patch in docs/dev/rbcodes-upstream.patch lands (fork/PR to be
  # confirmed by the maintainer). Drop the marker once the pin is relaxed upstream.
  "rbcodes @ git+https://github.com/rongmon/rbcodes@4499012e77eb3bbb9ca934b5b53909864581d060 ; python_full_version < '3.11'",
  "scipy>=1.11",
]

[project.entry-points."astro_canvas.nodes"]
rbcodes = "astro_canvas_rbcodes:register"

[tool.uv.sources]
astro-canvas-sdk = { workspace = true }
astro-canvas-core = { workspace = true }

[tool.astro-canvas]
display_name = "rbcodes: absorption and emission line spectroscopy"
publisher = "rongmon"
sample_data_dir = "sample_data"
templates_dir = "templates"
security = "standard"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_canvas_rbcodes"]

[tool.hatch.build.targets.wheel.force-include]
# Bundled sample data (see sample_data/SOURCES.md) and workflow templates travel inside the package.
"sample_data" = "astro_canvas_rbcodes/sample_data"
"templates" = "astro_canvas_rbcodes/templates"

[tool.hatch.metadata]
# Needed for the `rbcodes @ git+...` direct reference above.
allow-direct-references = true
