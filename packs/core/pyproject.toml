[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "astro-canvas-core"
version = "0.1.0a0"
description = "Astro Canvas core node pack: IO, math, plotting, astroquery, code node"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Bin Liu" }]
dependencies = [
  "astro-canvas-sdk",
  "numpy>=1.26",
  "astropy>=6",
  "pyarrow>=16",
]

[project.entry-points."astro_canvas.nodes"]
core = "astro_canvas_core:register"

[tool.uv.sources]
astro-canvas-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/astro_canvas_core"]
