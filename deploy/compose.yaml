# Astro Canvas for a research group: the app behind Caddy, with Postgres for the accounts.
#
#   cp deploy/.env.example deploy/.env   # set CANVAS_DOMAIN, ADMIN_EMAILS, POSTGRES_PASSWORD
#   docker compose -f deploy/compose.yaml up -d --build
#
# Caddy terminates TLS: a real domain gets a Let's Encrypt certificate automatically, and
# `localhost` gets Caddy's own local CA, which is what the CI smoke test uses. The app itself
# only ever speaks plain HTTP on the internal network - `public_url` is what tells it the
# outside is HTTPS, so the session cookie gets its `Secure` flag.

name: astro-canvas

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${CANVAS_IMAGE:-astro-canvas:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `--auth users` is what makes binding 0.0.0.0 acceptable (server/guard.py).
      ASTRO_CANVAS_AUTH: users
      ASTRO_CANVAS_PUBLIC_URL: https://${CANVAS_DOMAIN:-localhost}
      ASTRO_CANVAS_DATABASE_URL: postgresql://canvas:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/canvas
      ASTRO_CANVAS_ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ASTRO_CANVAS_REGISTRATION: ${REGISTRATION:-true}
      # A pack install changes what *every* user runs, so a shared server stays on the
      # curated registry and keeps the manager for admins only.
      ASTRO_CANVAS_PACK_SECURITY: ${PACK_SECURITY:-strict}
      ASTRO_CANVAS_MANAGER: ${MANAGER:-true}
      ASTRO_CANVAS_CACHE_MEMORY_MB: ${CACHE_MEMORY_MB:-1024}
      ASTRO_CANVAS_CACHE_DISK_GB: ${CACHE_DISK_GB:-50}
      ASTRO_CANVAS_MAX_WORKERS: ${MAX_WORKERS:-4}
      ASTRO_CANVAS_RUN_TIMEOUT_S: ${RUN_TIMEOUT_S:-3600}
      ASTRO_CANVAS_LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - data:/data
    expose:
      - '8765'

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: canvas
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U canvas -d canvas']
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CANVAS_DOMAIN: ${CANVAS_DOMAIN:-localhost}
      CANVAS_TLS: ${CANVAS_TLS:-internal}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  data:
  db:
  caddy-data:
  caddy-config:
