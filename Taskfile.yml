# https://taskfile.dev — task runner for Astro Canvas.
# Tooling rule: frontend only via pnpm, backend only via uv (see CONTRIBUTING.md).
version: '3'

env:
  MPLBACKEND: Agg
  QT_QPA_PLATFORM: offscreen

vars:
  BE: backend
  FE: frontend

tasks:
  default:
    silent: true
    cmds:
      - task --list

  install:
    desc: Install backend (uv sync) and frontend (pnpm install) dependencies
    cmds:
      - uv sync --directory {{.BE}} --all-extras
      - pnpm -C {{.FE}} install
      - pnpm -C {{.FE}} exec playwright install chromium

  dev:
    desc: Run the backend on :8765 and Vite on :5173 concurrently
    deps: [dev:be, dev:fe]

  dev:be:
    desc: Backend with auto-reload on http://127.0.0.1:8765
    cmds:
      - uv run --directory {{.BE}} uvicorn --factory astro_canvas.server.app:create_app --host 127.0.0.1 --port 8765 --reload --reload-dir src

  dev:fe:
    desc: Vite dev server on http://127.0.0.1:5173 (proxies /api and /ws to the backend)
    cmds:
      - pnpm -C {{.FE}} dev

  lint:
    desc: ruff + oxlint + eslint + prettier check + tooling rule
    cmds:
      - uv run --directory {{.BE}} ruff check . ../packs ../scripts
      - uv run --directory {{.BE}} ruff format --check . ../packs ../scripts
      - pnpm -C {{.FE}} lint
      - pnpm -C {{.FE}} format:check
      - task: check:tooling

  typecheck:
    desc: mypy (strict on sdk/engine) + vue-tsc
    cmds:
      - uv run --directory {{.BE}} mypy
      - pnpm -C {{.FE}} typecheck

  test:
    desc: All tests (backend, frontend unit, e2e)
    cmds:
      - task: test:py
      - task: test:fe
      - task: test:e2e

  test:py:
    desc: Backend pytest with coverage and per-package gates (sdk >= 90%, engine/store >= 85%)
    cmds:
      - uv run --directory {{.BE}} pytest
      - uv run --directory {{.BE}} python ../scripts/check_coverage.py

  test:fe:
    desc: Frontend Vitest
    cmds:
      - pnpm -C {{.FE}} test:unit

  test:e2e:
    desc: Playwright smoke against a real backend (starts both servers)
    cmds:
      - pnpm -C {{.FE}} test:e2e

  test:compose:
    desc: Build the Docker image and check the lab-server tier end to end (needs Docker)
    cmds:
      - bash deploy/tests/compose.sh

  test:launcher:
    desc: Smoke the one-line installers against a stub uv (no network)
    cmds:
      - bash launcher/tests/install-smoke.sh

  fmt:
    desc: Format and auto-fix backend and frontend
    cmds:
      - uv run --directory {{.BE}} ruff format . ../packs ../scripts
      - uv run --directory {{.BE}} ruff check --fix . ../packs ../scripts
      - pnpm -C {{.FE}} lint:fix
      - pnpm -C {{.FE}} format

  build:
    desc: Build the SPA, copy it into the app wheel, build the SDK and app wheels, verify
    cmds:
      - pnpm -C {{.FE}} build
      - uv run --directory {{.BE}} python ../scripts/copy_static.py
      - uv build {{.BE}}/sdk --out-dir {{.BE}}/dist
      - uv build {{.BE}}
      - uv run --directory {{.BE}} python ../scripts/check_wheel.py

  build:smoke:
    desc: Install the built wheel in a throwaway env and check it serves the SPA
    cmds:
      - uv run --isolated --no-project --with {{.BE}}/dist/astro_canvas_sdk-*.whl --with {{.BE}}/dist/astro_canvas-*.whl python scripts/smoke_wheel.py

  api:gen:
    desc: Export /api/openapi.json and regenerate the typed frontend client (src/api/schema.d.ts)
    cmds:
      - uv run --directory {{.BE}} python ../scripts/export_openapi.py
      - pnpm -C {{.FE}} exec openapi-typescript ../backend/src/astro_canvas/server/openapi/openapi.json -o src/api/schema.d.ts
      - pnpm -C {{.FE}} exec prettier --write src/api/schema.d.ts

  docs:
    desc: Serve the documentation site locally on http://127.0.0.1:8000
    cmds:
      - uv run --isolated --no-project --with 'mkdocs-material>=9.5,<10' --with 'mkdocs<2' mkdocs serve

  docs:build:
    desc: Build the documentation site into site/ (strict: a bad link fails the build)
    cmds:
      - uv run --isolated --no-project --with 'mkdocs-material>=9.5,<10' --with 'mkdocs<2' mkdocs build --strict

  check:tooling:
    desc: Fail if npm/npx/yarn/bun/pip/poetry/conda are invoked anywhere
    cmds:
      - uv run --directory {{.BE}} python ../scripts/check_tooling.py

  clean:
    desc: Remove build outputs
    cmds:
      - uv run --directory {{.BE}} python -c "import shutil,pathlib; [shutil.rmtree(p, ignore_errors=True) for p in ('dist', 'sdk/dist', '../frontend/dist')]; [p.unlink() for p in pathlib.Path('src/astro_canvas/static').rglob('*') if p.is_file() and p.name != '.gitkeep']"
