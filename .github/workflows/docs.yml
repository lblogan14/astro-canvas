name: Docs

# The site is built on every change with `--strict`, so a broken link or a page missing from the
# nav fails the build instead of shipping. Deploying is a separate, manual step: GitHub Pages has
# to be switched on for the repository first (Settings > Pages > Source: GitHub Actions), and
# doing that is the owner's decision, not this workflow's.
on:
  push:
    branches: [main, 'phase/**']
    paths:
      - 'docs/**'
      - mkdocs.yml
      - README.md
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - 'docs/**'
      - mkdocs.yml
      - README.md
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the built site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_COLOR: '1'

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Build
        run: >
          uv run --isolated --no-project
          --with 'mkdocs-material>=9.5,<10' --with 'mkdocs<2'
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: publish to GitHub Pages
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
