[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "astro-canvas"
dynamic = ["version"]
description = "Node-based infinite canvas for exploring astronomical spectra, images, and cubes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Bin Liu" }]
keywords = ["astronomy", "spectroscopy", "workflow", "canvas", "rbcodes"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astro-canvas-sdk",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
  "pydantic-settings>=2",
  "sqlalchemy>=2",
  "alembic>=1.13",
  "numpy>=1.26",
  "astropy>=6",
  "pyarrow>=16",
  "msgpack>=1.0",
  "blake3>=0.4",
  "tsdownsample>=0.1.3",
  "pebble>=5.0",
  "griffe>=1.0",
  "typer>=0.12",
  "platformdirs>=4",
  "structlog>=24",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "watchfiles>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "respx>=0.21",
]
users = [
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "fastapi-users[oauth,sqlalchemy]>=14",
]

[project.scripts]
astro-canvas = "astro_canvas.cli:app"

[project.urls]
Homepage = "https://github.com/lblogan14/astro-canvas"
Source = "https://github.com/lblogan14/astro-canvas"

[dependency-groups]
# Node packs developed in this monorepo. Installed editable by `uv sync` so the
# server can discover them; they are not runtime dependencies of the wheel.
packs = ["astro-canvas-core", "astro-canvas-rbcodes"]

[tool.uv]
default-groups = ["packs"]
# Make the universal lock pick versions with wheels for every developer platform
# (e.g. pyqt5-qt5, pulled in by rbcodes on 3.10, has no Windows wheel in recent releases).
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
astro-canvas-sdk = { workspace = true }
astro-canvas-core = { workspace = true }
astro-canvas-rbcodes = { workspace = true }

[tool.uv.workspace]
members = ["sdk", "../packs/*"]

[tool.hatch.version]
path = "src/astro_canvas/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_canvas"]
# The built SPA (frontend/dist) is copied here by `task build` / CI before `uv build`.
artifacts = ["src/astro_canvas/static/**"]
# The registry seed (a copy of ``registry/index.json``) is package data, not build output.
include = ["src/astro_canvas/manager/builtin_index.json"]

[tool.hatch.build.targets.sdist]
include = ["src/astro_canvas", "tests", "README.md"]


[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "sdk/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = [
  "PLR0913", # too many arguments (node functions legitimately take many params)
  "PLR0917", # too many positional arguments (same reason)
  "PLR2004", # magic value comparison
  "PLR0912", # too many branches
  "PLR0915", # too many statements
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0415"]

[tool.mypy]
# 3.12 because NumPy 2.5 stubs use PEP 695 syntax; 3.10 compatibility is covered by the CI matrix.
python_version = "3.12"
# `astro_canvas` is a namespace package split between src/ (app) and sdk/src/ (SDK).
files = ["src", "sdk/src", "../packs/core/src", "../packs/rbcodes/src"]
mypy_path = "src:sdk/src:../packs/core/src:../packs/rbcodes/src"
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["astro_canvas.sdk.*", "astro_canvas.engine.*"]
strict = true

[[tool.mypy.overrides]]
module = [
  "astropy.*",
  "pyarrow.*",
  "msgpack",
  "msgpack.*",
  "scipy",
  "scipy.*",
  "rbcodes.*",
  "pandas",
  "matplotlib.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Compiled extension without type hints for its downsampler classes; pebble's annotations are
# loose (``args: list``, ``timeout: float``) and several methods are untyped.
module = ["tsdownsample", "pebble", "pebble.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=astro_canvas --cov=astro_canvas_core --cov=astro_canvas_rbcodes --cov-report=term-missing --cov-report=json:coverage.json"
filterwarnings = ["error::DeprecationWarning:astro_canvas.*"]

[tool.coverage.run]
source = ["astro_canvas", "astro_canvas_core", "astro_canvas_rbcodes"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
